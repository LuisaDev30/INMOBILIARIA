<!--==Bloque nuevo:formulario de login y registro==-->
<main class="auth-container">
    <div class="auth-forms">
        <!--Tabs para alternar entre login y registro-->
        <div class="auth-tabs"
        <button class="auth-tab active" id="login-tab">Iniciar Sesion</button>
        <button class="auth-tab" id="Register-tab">Registrarse</button>
    </div>

    <!--    formulario login-->
        <form id="login-form" class="auth-forms">
            <h2>Accede a tu cuenta</h2>
            <div class="form-group">
                <label for="Login-email">Correo Electronico</label>
                <input type="email" id="login-email" placeholder="tucorreo@ejemplo.com" required>
            </div>
           <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" placeholder="Minimo 6 caracteres" required>
           </div>
           <button type="submit" class="auth-submit">Entrar</button>
           <p id="login-message" class="auth-forms"></p>
        </form>

        <!--Formulario de registro-->
        <form id="Register-form" class="auth-forms">
            <h2>Crea una nueva cuenta</h2>
        <div class="form-group">
            <label for="register-,name">Nombre Completo</label>
            <input type="text" id="register-name" placeholder="Juan Perez" required>
        </div>

        <div class="form-group">
            <label for="register-email">Correo Electronico</label>
            <input type="email" id="register-email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="register-password">Contraseña</label>
            <input type="password" id="register-password" placeholder="Minimo 6 caracteres" required>
        </div>

        <div class="form-group">
            <label for="register-confirm"> Confirmar Contraseña</label>
            <input type="password" id="register-confirm" placeholder="Repite tu contraseña" required>
        </div>

        <button type="submit" class="auth-submit">Registrarse</button>
        <p id="register-message" class="auth-message"></p>
        </form>  
    </div>
</main>
